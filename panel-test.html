<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>IDMS panel testi</title>
<style>html,body{margin:0;background:#10131a;color:#fff;font-family:sans-serif}video{display:block;width:640px;height:360px;background:#000}#ready{font-size:22px;padding:10px;color:#7ef}</style>
</head>
<body>
<div id="ready">idmsReady=?</div>
<canvas id="c" width="640" height="360" style="display:none"></canvas>
<script>
  const ready = document.getElementById('ready')
  setInterval(() => {
    ready.textContent = 'idmsReady=' + (document.documentElement.getAttribute('data-idms-ready') || '0') + ' focus=' + document.hasFocus()
  }, 300)

  const c = document.getElementById('c')
  const ctx = c.getContext('2d')
  let i = 0
  setInterval(() => {
    i++
    ctx.fillStyle = i % 2 ? '#1a7bf0' : '#0b1220'
    ctx.fillRect(0, 0, 640, 360)
    ctx.fillStyle = '#fff'
    ctx.font = 'bold 40px sans-serif'
    ctx.fillText('IDMS panel testi ' + i, 30, 200)
  }, 200)
  const v = document.createElement('video')
  v.autoplay = true
  v.muted = true
  v.playsInline = true
  v.width = 640
  v.height = 360
  v.controls = true
  v.srcObject = c.captureStream(10)
  document.body.appendChild(v)
  v.play().catch(() => {})
</script>
</body>
</html>
